baseURL = "https://kulenovic.si/"
languageCode = "en-us"
title = "Timur Kulenović"
theme = "coder"
defaultContentLanguage = "en"

[pagination]
  pagerSize = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[services]
  [services.googleAnalytics]
    id = "G-KH49H21VNG"

[params]
  author = "Timur Kulenović"
  description = "Timur Kulenović - portfolio"
  keywords = []
  colorScheme = "auto"
  hideColorSchemeToggle = false

  # Coder theme options
  maxSeeAlsoItems = 5
  customCSS = ["/css/custom.css"]
  customSCSS = []
  customJS = []

  # Home / about
  info = "Machine learning engineer"
  avatarURL = "/images/avatar.jpeg"

  # Favicon / PWA
  favicon_32 = "/images/favicon-32x32.png"
  favicon_16 = "/images/favicon-16x16.png"
  apple_touch_icon = "/images/apple-touch-icon.png"
  manifest = "/site.webmanifest"

# Social links shown on the home page
[[params.social]]
  name = "github"
  icon = "fa fa-github fa-2x"
  weight = 1
  url = "https://github.com/timurkulenovic"
  rel = "noopener"
[[params.social]]
  name = "linkedin"
  icon = "fa fa-linkedin fa-2x"
  weight = 2
  url = "https://linkedin.com/in/timurkulenovic"
  rel = "noopener"
[[params.social]]
  name = "twitter"
  icon = "fa fa-twitter fa-2x"
  weight = 3
  url = "https://twitter.com/timurkulenovic"
  rel = "noopener"
[[params.social]]
  name = "email"
  icon = "fa fa-envelope fa-2x"
  weight = 4
  url = "mailto:timur@kulenovic.si"
  rel = "noopener"

# Main navigation
[[menu.main]]
  name = "Projects"
  weight = 1
  url = "/projects/"
[[menu.main]]
  name = "Calendars"
  weight = 2
  url = "/calendars/"
[[menu.main]]
  name = "CV"
  weight = 3
  url = "/cv/"
